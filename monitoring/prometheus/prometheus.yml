global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: octabyteai

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager:9093 in production

scrape_configs:
  - job_name: octabyteai-app
    static_configs:
      - targets: ["app:3000"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s
