groups:
  - name: application
    rules:
      - alert: HighErrorRate
        expr: |
          rate(request_count{status=~"5.."}[5m]) /
          (rate(request_count[5m]) > 0) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate (> 5%)"
          description: "Error rate is {{ humanizePercentage $value }} for route {{ $labels.route }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency (> 2s)"
          description: "p95 latency is {{ humanizeDuration $value }} for route {{ $labels.route }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Target {{ $labels.instance }} ({{ $labels.job }}) is unreachable"

  - name: infrastructure
    rules:
      - alert: HighMemoryUsage
        expr: |
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage (> 80%)"
          description: "Memory usage is {{ humanizePercentage $value }} on {{ $labels.instance }}"

      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage (> 85%)"
          description: "CPU usage is {{ humanize $value }}% on {{ $labels.instance }}"

      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space (< 15% free)"
          description: "Only {{ humanizePercentage $value }} disk space remaining on {{ $labels.instance }}"

  - name: database
    rules:
      - alert: DatabaseConnectionsHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections > 80% of max"
          description: "{{ humanizePercentage $value }} of max connections in use"

      - alert: LongRunningTransaction
        expr: pg_stat_activity_max_tx_duration > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Long-running PostgreSQL transaction (> 5 min)"
          description: "Longest transaction has been running for {{ humanizeDuration $value }}"
